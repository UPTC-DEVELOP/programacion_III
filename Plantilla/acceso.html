<!DOCTYPE HTML>
<html lang="es">
	<head>
		<title>Iniciar Sesión - Olimac Riders Store</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<script>
			(function () {
				try {
					var modo = localStorage.getItem("olimac-theme") || localStorage.getItem("olimac_theme_mode");
					if (modo === "dark") {
						document.documentElement.classList.add("dark-mode", "theme-dark");
						if (document.body) document.body.classList.add("dark-mode");
					}
				} catch (e) {}
			})();
		</script>
		<link rel="stylesheet" href="assets/css/main.css?v=19" />
		<link rel="stylesheet" href="assets/css/modulos.css?v=19" />
		<link rel="stylesheet" href="assets/css/navbar.css?v=21" />
		<link rel="stylesheet" href="assets/css/theme.css?v=19" />
		<link rel="stylesheet" href="assets/css/components.css?v=19" />
		<link rel="stylesheet" href="assets/css/repuestos.css?v=19" />
		<link rel="stylesheet" href="assets/css/buttons.css?v=19" />
		<style>
			.login-contenedor {
				max-width: 460px;
				margin: 2rem auto;
				padding: 2rem;
				background: var(--bg-surface, #ffffff);
				border: 1px solid var(--border-color, #e2e8f0);
				border-radius: 12px;
				box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
				color: var(--text-secondary, #475569);
			}
			.login-contenedor h2 {
				margin-bottom: 0.4rem;
				text-align: center;
				color: var(--text-primary, #1e293b);
			}
			.login-subtitulo {
				text-align: center;
				color: var(--text-muted, #64748b);
				margin-bottom: 1.5rem;
				font-size: 0.95rem;
			}
			.login-campo {
				display: flex;
				flex-direction: column;
				gap: 0.35rem;
				margin-bottom: 1.1rem;
			}
			.login-campo span {
				font-weight: 600;
				color: var(--text-primary, #1e293b);
			}
			.login-campo input {
				width: 100%;
				padding: 0.7rem 0.9rem;
				border: 1px solid var(--border-color, #cbd5e1);
				border-radius: 8px;
				font-size: 1rem;
				background: var(--bg-input, #fff);
				color: var(--text-primary, #1e293b);
			}
			.login-boton {
				width: 100%;
				padding: 0.85rem;
				font-size: 1rem;
				margin-top: 0.5rem;
				cursor: pointer;
			}
			.login-error {
				margin-top: 1rem;
				padding: 0.75rem 1rem;
				border-radius: 8px;
				background: #fef2f2;
				border: 1px solid #fecaca;
				color: #b91c1c;
				font-size: 0.9rem;
			}
			.login-volver {
				display: block;
				text-align: center;
				margin-top: 1.25rem;
				font-size: 0.9rem;
			}
		</style>
	</head>
	<body class="is-preload ors-app">
		<div id="page-wrapper">

			<header class="ors-navbar" id="orsNavbar">
				<div class="ors-navbar__inner">
					<a class="ors-brand" href="index.html" aria-label="Olimac Riders Store - Inicio">
						<span class="ors-brand__icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" role="img" focusable="false">
								<circle cx="12" cy="12" r="3.2"></circle>
								<path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6.1 6.1l1.6 1.6M16.3 16.3l1.6 1.6M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6"></path>
								<path d="M14.8 9.2l3.4-1.1 1.1 3.4"></path>
							</svg>
						</span>
						<span class="ors-brand__text">
							<span class="ors-brand__name">Olimac Riders Store</span>
							<span class="ors-brand__sub">Gestión de Taller Mecánico</span>
						</span>
					</a>
					<nav class="ors-nav" aria-label="Navegación de acceso">
						<a class="ors-nav__cta" href="index.html">
							<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
								<path d="M4 11.5L12 5l8 6.5"></path>
								<path d="M7 10.5V19h10v-8.5"></path>
							</svg>
							<span>Inicio</span>
						</a>
					</nav>
				</div>
			</header>

			<section id="main">
				<div class="container">
					<div class="login-contenedor">
						<h2>Iniciar Sesión</h2>
						<p class="login-subtitulo">Ingresa tus credenciales de Administrador o Empleado</p>

						<form id="formLoginPrincipal" autocomplete="on">
							<label class="login-campo">
								<span>Usuario</span>
								<input type="text" id="loginUsuario" placeholder="Ej. admin o mecanico" autocomplete="username" required>
							</label>

							<label class="login-campo">
								<span>Contraseña</span>
								<input type="password" id="loginPassword" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
							</label>

							<button type="submit" id="btnIniciarSesion" class="rep-boton rep-boton-principal login-boton">
								Ingresar al Sistema
							</button>

							<div id="mensajeErrorLogin" class="login-error" hidden></div>
						</form>

						<a href="index.html" class="login-volver">← Volver a la página principal</a>
					</div>
				</div>
			</section>

		</div>

		<script src="assets/js/api-taller.js?v=20"></script>
		<script src="assets/js/theme.js?v=18"></script>
		<script src="assets/js/navbar.js?v=21"></script>
		<script>
			(function () {
				const TOKEN_KEY = "olimac_panther_token";
				const USER_KEY = "olimac_panther_user";
				const ROLE_KEY = "olimac_panther_role";
				const API_LOGIN = "../backend/rest/useraction/login";

				const tokenExistente = sessionStorage.getItem(TOKEN_KEY);
				const rolExistente = (sessionStorage.getItem(ROLE_KEY) || "").toLowerCase();
				if (tokenExistente) {
					const esAdmin = (rolExistente === "admin" || rolExistente === "administrador");
					window.location.href = esAdmin ? "no-sidebar.html" : "orden-servicio.html";
					return;
				}

				const form = document.getElementById("formLoginPrincipal");
				const inputUser = document.getElementById("loginUsuario");
				const inputPass = document.getElementById("loginPassword");
				const btnSubmit = document.getElementById("btnIniciarSesion");
				const cajaError = document.getElementById("mensajeErrorLogin");

				function mostrarError(texto) {
					cajaError.textContent = texto;
					cajaError.hidden = false;
				}

				form.addEventListener("submit", async function (e) {
					e.preventDefault();
					cajaError.hidden = true;

					const user = inputUser.value.trim();
					const password = inputPass.value;

					if (!user || !password) {
						mostrarError("Debes ingresar tu usuario y contraseña.");
						return;
					}

					btnSubmit.disabled = true;
					btnSubmit.textContent = "Verificando...";

					try {
						const respuesta = await fetch(API_LOGIN, {
							method: "POST",
							headers: { "Content-Type": "application/json" },
							body: JSON.stringify({ user, password })
						});

						const payload = await respuesta.json().catch(() => null);
						const usuarioData = payload && (payload.data || payload.body);

						if (!respuesta.ok || !payload || payload.code >= 400 || !usuarioData || !usuarioData.keyAPI) {
							const msg = (payload && (payload.message || payload.data || payload.body)) || "Usuario o contraseña incorrectos.";
							throw new Error(typeof msg === "string" ? msg : "Credenciales inválidas.");
						}

						const rolNormalizado = String(usuarioData.roles || "mecanico").trim().toLowerCase();

						sessionStorage.setItem(TOKEN_KEY, usuarioData.keyAPI);
						sessionStorage.setItem(USER_KEY, usuarioData.user || user);
						sessionStorage.setItem(ROLE_KEY, rolNormalizado);

						sessionStorage.setItem("olimac_sesion", JSON.stringify({
							token: usuarioData.keyAPI,
							userName: usuarioData.user || user,
							permisos: [rolNormalizado],
							createdAt: Date.now()
						}));

						if (rolNormalizado === "admin" || rolNormalizado === "administrador") {
							window.location.href = "no-sidebar.html";
						} else {
							window.location.href = "orden-servicio.html";
						}
					} catch (error) {
						mostrarError(error.message || "Error de conexión con el servidor.");
					} finally {
						btnSubmit.disabled = false;
						btnSubmit.textContent = "Ingresar al Sistema";
					}
				});
			})();
		</script>
		<script src="assets/js/buttons.js?v=18"></script>
</body>
</html>
