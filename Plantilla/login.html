<!DOCTYPE HTML>
<html lang="es">
	<head>
		<title>Iniciar sesión - Olimac Riders Store</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<script>
			(function () {
				try {
					var modo = localStorage.getItem("olimac-theme") || localStorage.getItem("olimac_theme_mode");
					if (modo === "dark") {
						document.documentElement.classList.add("dark-mode", "theme-dark");
						if (document.body) document.body.classList.add("dark-mode");
					}
				} catch (e) {}
			})();
		</script>
		<link rel="stylesheet" href="assets/css/main.css?v=19" />
		<link rel="stylesheet" href="assets/css/modulos.css?v=19" />
		<link rel="stylesheet" href="assets/css/navbar.css?v=19" />
		<link rel="stylesheet" href="assets/css/theme.css?v=19" />
		<link rel="stylesheet" href="assets/css/components.css?v=19" />
		<link rel="stylesheet" href="assets/css/login.css?v=19" />
		<link rel="stylesheet" href="assets/css/buttons.css?v=19" />
	</head>
	<body class="is-preload login-page ors-app">
		<div id="page-wrapper">
			<header class="ors-navbar" id="orsNavbar">
				<div class="ors-navbar__inner">
					<div class="ors-brand">
						<button type="button" class="ors-theme-toggle" title="Cambiar a modo oscuro" aria-label="Cambiar a modo oscuro" aria-pressed="false">
							<svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
								<circle cx="12" cy="12" r="4"></circle>
								<path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M18.9 5.1l-1.6 1.6M6.7 17.3l-1.6 1.6"></path>
							</svg>
							<svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
								<path d="M19.5 13.2A7.5 7.5 0 0 1 10.8 4.5 6.8 6.8 0 1 0 19.5 13.2z"></path>
							</svg>
						</button>
						<a class="ors-brand__text" href="index.html" aria-label="Olimac Riders Store - Inicio">
							<span class="ors-brand__name">Olimac Riders Store</span>
							<span class="ors-brand__sub">Gestión de Taller Mecánico</span>
						</a>
					</div>

					<nav class="ors-nav" aria-label="Navegación de acceso">
						<a class="ors-nav__cta" id="btnNavInicio" href="index.html">
							<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
								<path d="M4 11.5L12 5l8 6.5"></path>
								<path d="M7 10.5V19h10v-8.5"></path>
							</svg>
							<span>Inicio</span>
						</a>
					</nav>
				</div>
			</header>

			<section id="main">
				<div class="container">
					<div class="login-envoltorio">
						<article class="login-tarjeta" aria-labelledby="tituloLogin">
							<header class="login-marca">
								<h2 id="tituloLogin">Iniciar sesión</h2>
								<p>Ingresa con tu usuario del taller para abrir el panel de control.</p>
							</header>

							<p id="mensajeLogin" class="login-mensaje" hidden role="alert"></p>

							<form id="formLogin" autocomplete="on" novalidate>
								<label class="login-campo" for="usuarioLogin">
									<span>Usuario</span>
									<input type="text" id="usuarioLogin" name="usuario" maxlength="80" placeholder="Ej. admin" autocomplete="username" required>
								</label>

								<label class="login-campo" for="contrasenaLogin">
									<span>Contraseña</span>
									<span class="login-pass-fila">
										<input type="password" id="contrasenaLogin" name="contrasena" maxlength="120" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
										<button type="button" id="btnMostrarPass" class="login-toggle-pass" aria-label="Mostrar contraseña" aria-pressed="false">Ver</button>
									</span>
								</label>

								<div class="login-acciones">
									<button type="submit" id="btnIngresar" class="login-boton">Ingresar</button>
								</div>
							</form>

							<p class="login-pie">
								<a href="index.html" id="enlaceVolverInicio">← Volver a Inicio</a>
							</p>
						</article>
					</div>
				</div>
			</section>

			<footer id="footer">
				<div class="container">
					<div id="copyright">
						<ul class="menu">
							<li>&copy; Olimac Riders Store. Todos los derechos reservados.</li>
						</ul>
					</div>
				</div>
			</footer>
		</div>

		<script src="assets/js/jquery.min.js?v=18"></script>
		<script src="assets/js/jquery.dropotron.min.js?v=18"></script>
		<script src="assets/js/browser.min.js?v=18"></script>
		<script src="assets/js/breakpoints.min.js?v=18"></script>
		<script src="assets/js/util.js?v=18"></script>
		<script src="assets/js/main.js?v=18"></script>
		<script src="assets/js/api-taller.js?v=18"></script>
		<script src="assets/js/theme.js?v=18"></script>
		<script src="assets/js/navbar.js?v=18"></script>
		<script src="assets/js/login.js?v=18"></script>
		<script src="assets/js/buttons.js?v=18"></script>
	</body>
</html>
