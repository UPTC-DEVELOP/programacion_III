<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnicos</title>
    <link rel="stylesheet" href="assets/libs/bootstrap-icons/bootstrap-icons.css">
    <link href="assets/libs/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/cliente.css">
</head>
<body class="bg-dark-panel">
    <div id="sidebar-component"></div>

    <div class="main-wrapper">
        <div id="header-component"></div>

        <main class="content-body">
            <h2>Técnicos</h2>

            <div>
                <button type="button" id="btn-abrir-modal">+ Nuevo técnico</button>
            </div>

            <div class="barra-busqueda">
                <input type="search" id="input-busqueda" placeholder="Buscar técnico...">
                <button type="button" id="btn-buscar">Buscar</button>
            </div>

            <div class="alert alert-info d-none" id="catalogos-message" role="status"></div>

            <div class="Estado d-none" id="empty-state" aria-live="polite">
                <p>Aún no hay técnicos registrados.</p>
                <p>Haz clic en <strong>+ Nuevo técnico</strong>.</p>
            </div>

            <div class="tabla d-none" id="tabla-container">
                <table class="tabla_cliente">
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Técnico</th>
                            <th>Teléfono</th>
                            <th>Cargo</th>
                            <th>Especialidad</th>
                            <th>Fecha de ingreso</th>
                            <th>Estado</th>
                            <th class="acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista-tecnicos"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-overlay d-none" id="modal-tecnico">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <div class="modal-header">
                <h3 id="modal-titulo">Registrar técnico</h3>
                <button type="button" class="btn-close-modal" id="btn-cerrar-modal" aria-label="Cerrar">×</button>
            </div>

            <form id="form-tecnico">
                <input type="hidden" id="tecnico-id">

                <div class="form-group">
                    <label for="tecnico-cedula">Cédula <span class="required">*</span></label>
                    <input id="tecnico-cedula" name="cedula" type="text" maxlength="20"
                        autocomplete="off" required>
                </div>

                <div class="form-row">
                    <div class="form-group col-6">
                        <label for="tecnico-nombres">Nombres <span class="required">*</span></label>
                        <input id="tecnico-nombres" name="nombres" type="text" maxlength="100" required>
                    </div>
                    <div class="form-group col-6">
                        <label for="tecnico-apellidos">Apellidos <span class="required">*</span></label>
                        <input id="tecnico-apellidos" name="apellidos" type="text" maxlength="100" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tecnico-telefono">Teléfono</label>
                    <input id="tecnico-telefono" name="telefono" type="tel" maxlength="20">
                </div>

                <div class="form-row">
                    <div class="form-group col-6">
                        <label for="tecnico-cargo">Cargo <span class="required">*</span></label>
                        <select id="tecnico-cargo" name="id_cargo" required>
                            <option value="">Selecciona un cargo</option>
                        </select>
                    </div>
                    <div class="form-group col-6">
                        <label for="tecnico-especialidad">Especialidad</label>
                        <select id="tecnico-especialidad" name="id_especialidad">
                            <option value="">Sin especialidad</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-6">
                        <label for="tecnico-fecha-ingreso">Fecha de ingreso <span class="required">*</span></label>
                        <input id="tecnico-fecha-ingreso" name="fecha_ingreso" type="date" required>
                    </div>
                    <div class="form-group col-6">
                        <label for="tecnico-estado">Estado <span class="required">*</span></label>
                        <select id="tecnico-estado" name="estado" required>
                            <option value="Activo" selected>Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btn-guardar">Registrar técnico</button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/header_nav.js"></script>
    <script src="js/Tecnicos.js"></script>
</body>
</html>
