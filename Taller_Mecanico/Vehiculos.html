<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos</title>
    <link rel="stylesheet" href="assets/libs/bootstrap-icons/bootstrap-icons.css">
    <link href="assets/libs/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <!-- Opcional: puedes crear un vehiculo.css o seguir usando cliente.css si comparten los mismos estilos exactos -->
    <link rel="stylesheet" href="css/cliente.css">
</head>
<body class="bg-dark-panel">

    <div id="sidebar-component"></div>

    <div class="main-wrapper">
        <div id="header-component"></div>

        <main class="content-body">
            <h2>Vehículos</h2>

            <div>
                <button type="button" id="btn-abrir-modal">
                    + Nuevo vehículo
                </button>
            </div>

            <div class="barra-busqueda">
                <input type="text" id="input-busqueda" placeholder="Buscar por placa, marca o cliente...">
                <button type="button">Buscar</button>
            </div>

            <div class="Estado d-none" id="empty-state">
                <p>Aún no hay vehículos registrados.</p>
                <p>Haz clic en <strong>+ Nuevo vehículo</strong></p>
            </div>

            <div class="tabla" id="tabla-container">
                <table class="tabla_cliente"> <!-- Mantuve la clase por si tu CSS depende de ella -->
                    <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Año</th>
                            <th>Propietario (Cliente)</th>
                            <th class="acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="lista_cliente" id="lista-vehiculos">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL PARA REGISTRAR VEHÍCULO -->
    <div class="modal-overlay d-none" id="modal-vehiculo">
        <div class="modal-card">
            
            <div class="modal-header">
                <h3 id="modal-titulo">Registrar nuevo vehículo</h3>
                <button type="button" class="btn-close-modal" id="btn-cerrar-modal">×</button>
            </div>

            <form id="form-vehiculo">
                <input type="hidden" id="vehiculo-id">

                <div class="form-group">
                    <label for="vehiculo-placa">Placa <span class="required">*</span></label>
                    <input type="text" id="vehiculo-placa" placeholder="Ej. ABC-123" required>
                </div>

                <div class="form-row">
                    <div class="form-group col-6">
                        <label for="vehiculo-marca">Marca <span class="required">*</span></label>
                        <input type="text" id="vehiculo-marca" placeholder="Ej. Toyota, Chevrolet" required>
                    </div>

                    <div class="form-group col-6">
                        <label for="vehiculo-modelo">Modelo <span class="required">*</span></label>
                        <input type="text" id="vehiculo-modelo" placeholder="Ej. Corolla, Spark" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="vehiculo-anio">Año <span class="required">*</span></label>
                    <!-- Cambiado a tipo number para el año -->
                    <input type="number" id="vehiculo-anio" placeholder="Ej. 2022" required>
                </div>

                <!-- Propietario (Desplegable) -->
                <div class="form-group">
                    <label for="vehiculo-propietario">Propietario (Cliente) <span class="required">*</span></label>
                    <!-- Usamos un select para que el JS cargue los clientes existentes -->
                    <select id="vehiculo-propietario" class="form-control" required>
                        <option value="">Seleccione un cliente registrado...</option>
                        <!-- Aquí tu JS (Vehiculo.js) insertará las opciones de los clientes -->
                    </select>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btn-guardar">Registrar vehículo</button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/header_nav.js"></script>
    <!-- ¡OJO! Aquí vinculamos el nuevo archivo JS que deberás crear -->
    <script src="js/Vehiculos.js"></script>
</body>
</html>
