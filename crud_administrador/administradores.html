<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Administradores | TallerPro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>🔧</text></svg>">
  <link rel="stylesheet" href="administradores.css">
</head>
<body class="ca-body">

  
    <!-- ===== BARRA SUPERIOR ===== -->
  <header class="ca-topbar">
    <a href="../index.html" class="ca-brand">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <span>Taller<span>Pro</span></span>
    </a>

    <div class="ca-user">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21a8 8 0 0 1 16 0z"/>
      </svg>
      <span>Administrador</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </div>
  </header>

  <div class="ca-layout">

    <!-- ===== MENÚ LATERAL ===== -->
    <aside class="ca-sidebar">
      <nav class="ca-menu" aria-label="Menú del panel">
        <a href="administradores.html" class="is-active" aria-current="page">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Administradores
        </a>
        <a href="../index.html">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/>
          </svg>
          Inicio
        </a>
        <a href="../index.html" id="cerrarSesion">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
          Cerrar sesión
        </a>
      </nav>
    </aside>

    <!-- ===== CONTENIDO ===== -->
    <main class="ca-content">
      <section class="ca-card">
        <div class="ca-card__head">
          <h1>CRUD Administradores</h1>
          <button type="button" class="ca-btn ca-btn--primary" id="btnRegistrar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Registrar administrador
          </button>
        </div>

        <div class="ca-table-wrap">
          <table class="ca-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Usuario</th>
                <th>Correo</th>
                <th>Rol</th>
                <th class="ca-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaAdmins"></tbody>
          </table>
          <p class="ca-empty" id="sinDatos" hidden>No hay administradores registrados.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== MODAL CREAR / EDITAR ===== -->
  <div class="ca-modal" id="modalAdmin" role="dialog" aria-modal="true" aria-labelledby="modalTitulo" hidden>
    <div class="ca-modal__card">
      <button type="button" class="ca-modal__close" id="cerrarModal" aria-label="Cerrar">&times;</button>
      <h2 id="modalTitulo">Registrar administrador</h2>

      <form id="formAdmin" novalidate>
        <input type="hidden" id="adminId">

        <div class="ca-field">
          <label for="fNombre">Nombre completo</label>
          <input type="text" id="fNombre" placeholder="Ej: Laura Gómez">
          <span class="ca-err" id="eNombre"></span>
        </div>
        <div class="ca-field">
          <label for="fUsuario">Usuario</label>
          <input type="text" id="fUsuario" placeholder="Ej: lauraadmin">
          <span class="ca-err" id="eUsuario"></span>
        </div>
        <div class="ca-field">
          <label for="fCorreo">Correo</label>
          <input type="email" id="fCorreo" placeholder="correo@tallerpro.com">
          <span class="ca-err" id="eCorreo"></span>
        </div>
        <div class="ca-field">
          <label for="fRol">Rol</label>
          <select id="fRol">
            <option value="Administrador">Administrador</option>
            <option value="SuperAdmin">SuperAdmin</option>
          </select>
        </div>

        <div class="ca-modal__actions">
          <button type="button" class="ca-btn ca-btn--ghost" id="cancelarModal">Cancelar</button>
          <button type="submit" class="ca-btn ca-btn--primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== MODAL CONFIRMAR ELIMINAR ===== -->
  <div class="ca-modal" id="modalEliminar" role="alertdialog" aria-modal="true" aria-labelledby="elimTitulo" hidden>
    <div class="ca-modal__card ca-modal__card--sm">
      <h2 id="elimTitulo">Eliminar administrador</h2>
      <p id="elimTexto"></p>
      <div class="ca-modal__actions">
        <button type="button" class="ca-btn ca-btn--ghost" id="cancelarElim">Cancelar</button>
        <button type="button" class="ca-btn ca-btn--danger" id="confirmarElim">Eliminar</button>
      </div>
    </div>
  </div>

  <div class="ca-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="administradores.js"></script>
</body>
</html>
