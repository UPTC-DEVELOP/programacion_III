<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Clientes | TallerPro</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="clientes.css">
</head>
<body>

  <!-- Layout Principal -->
  <div class="app-container">
    
    <!-- Encabezado Superior -->
    <header class="main-header px-4 py-3">
      <div class="brand-logo d-flex align-items-center gap-2">
        <i class="bi bi-wrench-adjustable fs-3 text-white"></i>
        <span class="fs-3 fw-bold text-white">TallerPro</span>
      </div>
    </header>

    <!-- Cuerpo Principal con Sidebar + Contenido -->
    <div class="main-body">
      
      <!-- Menú Lateral (Sidebar Left) -->
      <aside class="sidebar-nav">
        <nav class="nav flex-column gap-2 p-3">
          <a href="clientes_2.html" class="sidebar-link active">
            <i class="bi bi-people-fill fs-5"></i>
            <span>Clientes</span>
          </a>
          <a href="../index.html" class="sidebar-link">
            <i class="bi bi-house-door-fill fs-5"></i>
            <span>Inicio</span>
          </a>
          <a href="../index.html" class="sidebar-link">
            <i class="bi bi-box-arrow-right fs-5"></i>
            <span>Cerrar sesión</span>
          </a>
        </nav>
      </aside>

      <!-- Área de Contenido Principal -->
      <main class="content-area p-4">
        <div class="card-crud p-4">
          
          <!-- Encabezado del CRUD -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="crud-title m-0">CRUD Clientes</h2>
            <button class="btn btn-registrar" onclick="abrirModalCrear()">
              <i class="bi bi-plus-lg me-1"></i> Registrar cliente
            </button>
          </div>

          <!-- Tabla de Clientes -->
          <div class="table-responsive">
            <table class="table table-custom align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Cédula</th>
                  <th>Correo</th>
                  <th>Teléfono</th>
                  <th>Empresa</th>
                  <th>Estado</th>
                  <th class="text-end pe-3">Acciones</th>
                </tr>
              </thead>
              <tbody id="clientTableBody">
                <!-- Creado dinámicamente -->
              </tbody>
            </table>
          </div>

          <div id="emptyState" class="text-center py-5 d-none">
            <i class="bi bi-inbox text-muted display-4"></i>
            <p class="text-muted mt-2">No hay clientes registrados.</p>
          </div>

        </div>
      </main>

    </div>
  </div>

  <!-- Modal Registrar/Editar Cliente -->
  <div class="modal fade" id="clientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="modalTitle">Registrar cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="clientForm" novalidate>
            <input type="hidden" id="clientId">
            
            <div class="mb-3">
              <label for="nameInput" class="form-label fw-semibold">Nombre Completo *</label>
              <input type="text" class="form-control" id="nameInput" required placeholder="Ej. Laura Gómez">
              <div class="invalid-feedback">Ingresa un nombre válido.</div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="cedulaInput" class="form-label fw-semibold">Cédula *</label>
                <input type="text" class="form-control" id="cedulaInput" required placeholder="Ej. 1001234567">
                <div class="invalid-feedback">Ingresa una cédula válida.</div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="phoneInput" class="form-label fw-semibold">Teléfono *</label>
                <input type="tel" class="form-control" id="phoneInput" required placeholder="Ej. 300 123 4567">
                <div class="invalid-feedback">Ingresa un teléfono válido.</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="emailInput" class="form-label fw-semibold">Correo Electrónico *</label>
              <input type="email" class="form-control" id="emailInput" required placeholder="correo@tallerpro.com">
              <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="companyInput" class="form-label fw-semibold">Empresa</label>
                <input type="text" class="form-control" id="companyInput" placeholder="Ej. TallerPro">
              </div>
              <div class="col-md-6 mb-3">
                <label for="statusSelect" class="form-label fw-semibold">Estado</label>
                <select class="form-select" id="statusSelect">
                  <option value="Activo">Activo</option>
                  <option value="Inactivo">Inactivo</option>
                </select>
              </div>
            </div>

            <div class="modal-footer border-0 px-0 pb-0 pt-3">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-registrar">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="clientes.js"></script>
</body>
</html>
