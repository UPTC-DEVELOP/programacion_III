<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTOGESTION ERP - Empleados</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/crud.css">
</head>
<body>

    <header>
        <img src="img/logo.jpeg" alt="AutoGestión ERP">
        <nav>
            <a href="modulos.html">← Módulos</a>
            <a href="index.html">Inicio</a>
        </nav>
    </header>

    <main class="crud">

        <div class="crud-encabezado">
            <p>MÓDULO 01</p>
            <h1>GESTIÓN DE <span>EMPLEADOS</span></h1>
        </div>

        <!-- FORMULARIO -->
        <section class="crud-caja">
            <h2 id="tituloForm">NUEVO EMPLEADO</h2>

            <form id="formEmpleado">
                <div class="crud-campos">
                    <div class="campo">
                        <label for="documento">Documento *</label>
                        <input type="text" id="documento" required>
                    </div>

                    <div class="campo">
                        <label for="nombre">Nombre completo *</label>
                        <input type="text" id="nombre" required>
                    </div>

                    <div class="campo">
                        <label for="cargo">Cargo *</label>
                        <select id="cargo" required>
                            <option value="">Seleccione...</option>
                            <option>Mecánico</option>
                            <option>Electricista automotriz</option>
                            <option>Asesor de servicio</option>
                            <option>Recepcionista</option>
                            <option>Administrador</option>
                            <option>Auxiliar</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono *</label>
                        <input type="tel" id="telefono" required>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo *</label>
                        <input type="email" id="correo" required>
                    </div>

                    <div class="campo">
                        <label for="fechaIngreso">Fecha de ingreso *</label>
                        <input type="date" id="fechaIngreso" required>
                    </div>

                    <div class="campo">
                        <label for="estado">Estado</label>
                        <select id="estado">
                            <option>Activo</option>
                            <option>Inactivo</option>
                        </select>
                    </div>
                </div>

                <p id="mensaje" class="mensaje-confirmacion"></p>

                <div class="crud-botones">
                    <button type="submit" id="btnGuardar" class="boton-principal">GUARDAR EMPLEADO</button>
                    <button type="button" id="btnCancelar" class="btn-cancelar oculto">CANCELAR EDICIÓN</button>
                </div>
            </form>
        </section>

        <!-- TABLA -->
        <section class="crud-caja">
            <div class="tabla-encabezado">
                <h2>LISTA DE EMPLEADOS</h2>
                <input type="search" id="buscador" placeholder="Buscar por nombre, documento o cargo...">
            </div>

            <div class="tabla-scroll">
                <table class="tabla-crud">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Documento</th>
                            <th>Nombre</th>
                            <th>Cargo</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Ingreso</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEmpleados"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="js/empleados.js"></script>
</body>
</html>
