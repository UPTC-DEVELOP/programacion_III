<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Empleados | TallerPro</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2218%22 font-size=%2218%22>🔧</text></svg>">
  <link rel="stylesheet" href="empleados.css">
</head>
<body class="ca-body">

  
    <!-- ===== BARRA SUPERIOR ===== -->
  <header class="ca-topbar">
    <a href="../index.html" class="ca-brand">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <span>Taller<span>Pro</span></span>
    </a>

  </header>

  <div class="ca-layout">

    <!-- ===== MENÚ LATERAL ===== -->
    <aside class="ca-sidebar">
      <nav class="ca-menu" aria-label="Menú del panel">
        <a href="empleados.html" class="is-active" aria-current="page">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Empleados
        </a>
        
        </a>
        <a href="../index.html">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/>
          </svg>
          Inicio
        </a>
        <a href="../index.html" id="cerrarSesion">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
          Cerrar sesión
        </a>
      </nav>
    </aside>

    <!-- ===== CONTENIDO ===== -->
    <main class="ca-content">
      <section class="ca-card">
        <div class="ca-card__head">
          <h1>CRUD Empleados</h1>
          <button type="button" class="ca-btn ca-btn--primary" id="btnRegistrar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Registrar empleado
          </button>
        </div>

        <div class="ca-table-wrap">
          <table class="ca-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Cédula</th>
                <th>Cargo</th>
                <th>Teléfono</th>
                <th class="ca-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaEmpleados"></tbody>
          </table>
          <p class="ca-empty" id="sinDatos" hidden>No hay empleados registrados.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== MODAL CREAR / EDITAR ===== -->
  <div class="ca-modal" id="modalEmpleado" role="dialog" aria-modal="true" aria-labelledby="modalTitulo" hidden>
    <div class="ca-modal__card">
      <button type="button" class="ca-modal__close" id="cerrarModal" aria-label="Cerrar">&times;</button>
      <h2 id="modalTitulo">Registrar empleado</h2>

      <form id="formEmpleado" novalidate>
        <input type="hidden" id="empleadoId">

        <div class="ca-field">
          <label for="fNombre">Nombre completo</label>
          <input type="text" id="fNombre" placeholder="Ej: Juan Pérez">
          <span class="ca-err" id="eNombre"></span>
        </div>
        <div class="ca-field">
          <label for="fCedula">Cédula / Documento</label>
          <input type="text" id="fCedula" placeholder="Ej: 123456789">
          <span class="ca-err" id="eCedula"></span>
        </div>
        <div class="ca-field">
          <label for="fCargo">Cargo</label>
          <select id="fCargo">
            <option value="Mecánico">Mecánico</option>
            <option value="Recepcionista">Recepcionista</option>
            <option value="Jefe de Taller">Jefe de Taller</option>
            <option value="Auxiliar">Auxiliar</option>
          </select>
        </div>
        <div class="ca-field">
          <label for="fTelefono">Teléfono</label>
          <input type="tel" id="fTelefono" placeholder="Ej: 300 123 4567">
          <span class="ca-err" id="eTelefono"></span>
        </div>

        <div class="ca-modal__actions">
          <button type="button" class="ca-btn ca-btn--ghost" id="cancelarModal">Cancelar</button>
          <button type="submit" class="ca-btn ca-btn--primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== MODAL CONFIRMAR ELIMINAR ===== -->
  <div class="ca-modal" id="modalEliminar" role="alertdialog" aria-modal="true" aria-labelledby="elimTitulo" hidden>
    <div class="ca-modal_card ca-modal_card--sm">
      <h2 id="elimTitulo">Eliminar empleado</h2>
      <p id="elimTexto"></p>
      <div class="ca-modal__actions">
        <button type="button" class="ca-btn ca-btn--ghost" id="cancelarElim">Cancelar</button>
        <button type="button" class="ca-btn ca-btn--danger" id="confirmarElim">Eliminar</button>
      </div>
    </div>
  </div>

  <div class="ca-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="empleados.js"></script>
</body>
</html>
