<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de Clientes</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <div class="container py-4">
    <!-- Encabezado -->
    <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
      <span class="fs-4 fw-bold text-primary">
        <i class="bi bi-people-fill me-2"></i>Gestión de Clientes
      </span>
      <button class="btn btn-primary" onclick="abrirModalCrear()">
        <i class="bi bi-person-plus-fill me-1"></i> Nuevo Cliente
      </button>
    </header>

    <!-- Barra de Búsqueda y Estadísticas -->
    <div class="row g-3 mb-4">
      <div class="col-md-8">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nombre, email o empresa..." onkeyup="filtrarClientes()">
        </div>
      </div>
      <div class="col-md-4 text-md-end">
        <span class="badge bg-secondary p-2 fs-6">
          Total Clientes: <span id="totalCount">0</span>
        </span>
      </div>
    </div>

    <!-- Tabla de Clientes -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Contacto</th>
                <th>Empresa</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="clientTableBody">
              <!-- Se puebla dinámicamente con JS -->
            </tbody>
          </table>
        </div>
        <div id="emptyState" class="text-center py-5 d-none">
          <i class="bi bi-inbox text-muted fs-1 display-1"></i>
          <p class="text-muted mt-2">No se encontraron clientes registrado(s).</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Agregar/Editar Cliente -->
  <div class="modal fade" id="clientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Nuevo Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="clientForm">
            <input type="hidden" id="clientId">
            
            <div class="mb-3">
              <label for="nameInput" class="form-label">Nombre Completo *</label>
              <input type="text" class="form-control" id="nameInput" required>
            </div>


             <div class="mb-3">
              <label for="nameInput" class="form-label">Edad*</label>
              <input type="text" class="form-control" id="edadInput" required>
            </div>


            <div class="mb-3">
              <label for="emailInput" class="form-label">Correo Electrónico *</label>
              <input type="email" class="form-control" id="emailInput" required>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="phoneInput" class="form-label">Teléfono *</label>
                <input type="tel" class="form-control" id="phoneInput" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="companyInput" class="form-label">Empresa</label>
                <input type="text" class="form-control" id="companyInput">
              </div>
            </div>

            <div class="mb-3">
              <label for="statusSelect" class="form-label">Estado</label>
              <select class="form-select" id="statusSelect">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>

            <div class="modal-footer px-0 pb-0 pt-3">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="saveButton">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 para alertas -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Lógica de JavaScript -->
  <script src="app.js"></script>
</body>
</html>
